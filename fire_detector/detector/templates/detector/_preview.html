{% if original_data_uri %}
<div style="text-align:center; margin-bottom:15px;">
  <p style="color:#10b981; font-weight:bold; background:rgba(16,185,129,0.1);
            border:1px solid rgba(16,185,129,0.4); padding:8px; border-radius:6px; display:inline-block;">
    ✅ Imagen cargada correctamente
  </p>
</div>

<div style="display:flex; justify-content:center; gap:40px; flex-wrap:wrap; margin-top:20px;">
  <div style="text-align:center;">
    <h4 style="color:#fbbf24;">Imagen Original</h4>
    <img src="{{ original_data_uri }}" alt="original" style="width:340px; border-radius:10px;
         box-shadow:0 0 10px rgba(255,255,255,0.2);">
  </div>

  <div style="text-align:center;">
    <h4 style="color:#fbbf24;">Vista Procesada</h4>
    <img src="{{ processed_data_uri }}" alt="procesada" style="width:340px; border-radius:10px;
         box-shadow:0 0 10px rgba(255,255,255,0.2);">
  </div>
</div>

{% else %}
<p style="opacity:.7; text-align:center; margin-top:20px;">
  Aún no se ha cargado ninguna imagen.
</p>
{% endif %}
